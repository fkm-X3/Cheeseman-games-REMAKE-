<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Combat - WASM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-wrapper {
            position: relative;
        }
        #game-canvas {
            border: 2px solid #333;
            background: #f0f0f0;
            display: block;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        #loading {
            color: #fff;
            font-size: 24px;
            padding: 40px;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .menu-screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            box-sizing: border-box;
        }

        .menu-screen.active {
            display: flex;
        }

        .menu-title {
            font-size: 72px;
            color: red;
            margin-bottom: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 0 blue;
        }

        .sub-title {
            font-size: 50px;
            color: white;
            margin-bottom: 30px;
        }

        .btn {
            color: white;
            border: none;
            padding: 15px 0;
            font-size: 24px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s, filter 0.1s;
            width: 300px;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
            display: block;
        }

        .btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .btn-green {
            background: #00C800;
            color: black;
        }

        .btn-blue {
            background: #0000FF;
            color: white;
        }

        .btn-pink {
            background: #FFC0CB;
            color: black;
        }

        .btn-gray {
            background: #646464;
            color: black;
        }

        .btn-red {
            background: #FF0000;
            color: black;
        }

        .btn-cyan {
            background: #00FFFF;
            color: black;
        }

        .btn-orange {
            background: #FFA500;
            color: black;
        }

        .cubes-layout {
            display: flex;
            flex-direction: row;
            width: 90%;
            height: 70%;
            margin-top: 20px;
        }

        .cubes-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 80px;
            gap: 20px;
            overflow-y: auto;
            padding: 10px;
        }

        .cube-icon {
            width: 60px;
            height: 60px;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .cube-icon:hover {
            transform: scale(1.1);
        }

        .cube-icon.selected {
            border: 4px solid #00FF00;
            box-shadow: 0 0 15px #00FF00;
        }

        .cube-icon.locked {
            position: relative;
            filter: grayscale(100%) brightness(0.4);
        }

        .cube-icon.locked::after {
            content: '🔒';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: white;
            text-shadow: 0 0 4px black;
        }

        .cube-details {
            flex: 1;
            background: #333;
            border: 3px solid white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            color: white;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-label {
            color: #00FFFF;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            color: #ccc;
        }

        .achievements-list {
            width: 80%;
            height: 70%;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
        }

        .achievement-item {
            background: #333;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-item.unlocked {
            background: #00aa00;
            color: black;
        }

        .achievement-item.locked {
            background: #444;
            color: #aaa;
        }

        .hidden {
            display: none !important;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .p2p-input {
            width: 400px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            margin: 10px;
            background-color: #333;
            border: 2px solid #5372ff;
            color: #fff;
            border-radius: 4px;
        }

        .p2p-status {
            color: yellow;
            margin-bottom: 15px;
            font-size: 18px;
            height: 24px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #222;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>

    <script type="module">
        import init, { init_game, init_menu, game_loop, handle_key_down, handle_key_up, restart_game, nav_to, prepare_game, show_game_over, go_to_menu } from './cube_combat_wasm.js';

        async function start() {
            await init();
            init_game('game-canvas');
            init_menu();

            document.addEventListener('keydown', (e) => {
                if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyR', 'Escape'].includes(e.code)) {
                    e.preventDefault();
                }
                handle_key_down(e.key.toLowerCase());
            });

            document.addEventListener('keyup', (e) => {
                handle_key_up(e.key.toLowerCase());
            });

            document.getElementById('btn-start-game')?.addEventListener('click', () => {
                nav_to('screen-modes');
            });

            document.getElementById('btn-collected-cubes')?.addEventListener('click', () => {
                nav_to('screen-cubes');
            });

            document.getElementById('btn-achievements')?.addEventListener('click', () => {
                nav_to('screen-achievements');
            });

            document.getElementById('btn-reset-progress')?.addEventListener('click', () => {
                if (confirm('Are you sure you want to reset all progress?')) {
                    localStorage.clear();
                }
            });

            document.getElementById('btn-quit')?.addEventListener('click', () => {
                window.location.href = '/games';
            });

            document.getElementById('btn-pvai')?.addEventListener('click', () => {
                prepare_game('ai', 'screen-modes');
            });

            document.getElementById('btn-pvp')?.addEventListener('click', () => {
                nav_to('screen-pvp-submenu');
            });

            document.getElementById('btn-back-modes')?.addEventListener('click', () => {
                nav_to('screen-main');
            });

            document.getElementById('btn-local-mp')?.addEventListener('click', () => {
                prepare_game('pvp', 'screen-pvp-submenu');
            });

            document.getElementById('btn-p2p-mp')?.addEventListener('click', () => {
                prepare_game('p2p_setup', 'screen-pvp-submenu');
            });

            document.getElementById('btn-back-pvp')?.addEventListener('click', () => {
                nav_to('screen-modes');
            });

            document.getElementById('btn-host-game')?.addEventListener('click', () => {
                document.getElementById('p2p-host-section').style.display = 'block';
                document.getElementById('p2p-join-section').style.display = 'none';
                document.getElementById('p2p-buttons').style.display = 'none';
                document.getElementById('p2p-status-msg').textContent = 'Host mode - waiting for connection...';
            });

            document.getElementById('btn-join-game')?.addEventListener('click', () => {
                document.getElementById('p2p-host-section').style.display = 'none';
                document.getElementById('p2p-join-section').style.display = 'block';
                document.getElementById('p2p-buttons').style.display = 'none';
                document.getElementById('p2p-status-msg').textContent = 'Enter host ID to connect';
            });

            document.getElementById('btn-connect')?.addEventListener('click', () => {
                const hostId = document.getElementById('join-id-input').value;
                if (hostId) {
                    prepare_game('p2p', 'screen-p2p-lobby');
                }
            });

            document.getElementById('btn-back-p2p')?.addEventListener('click', () => {
                document.getElementById('p2p-host-section').style.display = 'none';
                document.getElementById('p2p-join-section').style.display = 'none';
                document.getElementById('p2p-buttons').style.display = 'block';
                document.getElementById('p2p-status-msg').textContent = 'Select Host or Join';
                nav_to('screen-pvp-submenu');
            });

            document.getElementById('btn-back-cubes')?.addEventListener('click', () => {
                nav_to('screen-main');
            });

            document.getElementById('btn-sandbox')?.addEventListener('click', () => {
                prepare_game('sandbox', 'screen-cubes');
            });

            document.getElementById('btn-fight')?.addEventListener('click', () => {
                prepare_game('ai', 'screen-cubes');
            });

            document.getElementById('btn-back-achievements')?.addEventListener('click', () => {
                nav_to('screen-main');
            });

            document.getElementById('btn-restart')?.addEventListener('click', () => {
                restart_game();
            });

            document.getElementById('btn-main-menu')?.addEventListener('click', () => {
                go_to_menu();
            });

            function loop() {
                game_loop();
                requestAnimationFrame(loop);
            }
            loop();
        }

        start().catch(console.error);
    </script>
</body>
</html>
